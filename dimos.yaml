title: Viser
spec-version: v1.3 # the dimos.yaml spec version this file follows
version: "0.1.12" # this app's own version (its latest release tag)
uses:
    "@desktop-gateway":
        - GET /api/apps
    # the dim-app SDK's zenoh client (backend state, events): the zenoh bridge and how it finds it
    "@zenoh-gateway": ">=0.5 <0.6"
# spec v1.2: what the page may do on zenoh (zenoh's ACL config); it only subscribes
zenoh:
    default_permission: deny
    read:
        # dim-app's useBackendState: this app's own state/<key> events (Desktop's <namespace>/apps/<app>/frontend)
        - id: own-frontend-topics
          messages: [declare_subscriber, put]
          key_exprs: ["dimos-desktop/*/apps/dim-viser/frontend/**"]
          permission: allow
caches:
    - url: "https://dimos-desktop.cachix.org"
      key: "dimos-desktop.cachix.org-1:A4P35aGJGmCan92LWyamtSFXMqaVE+VRFYnrJ8QMTeQ="
nix:
    cache:
        aarch64-linux:
            - packages.aarch64-darwin.dimosApp-aarch64-linux
            - packages.x86_64-linux.dimosApp-aarch64-linux
        x86_64-linux:
            - packages.aarch64-darwin.dimosApp-x86_64-linux
provides:
    openapi: 3.1.0
    info:
        title: Viser
        version: 1.0.0
        description: >-
            Viser: shows the 3D manipulation planning view (viser) a dimos manipulation blueprint serves, inside Desktop
        x-when: you need to show or check the manipulation planning view (viser)
    # what its server answers only its own pages (its paths: below are the public API)
    x-private:
        - api/state/*
        - api/target/*
    paths:
        /api/state:
            get:
                description: >-
                    Viser's state. Takes nothing; answers JSON: target ({host, port} or {url}, the viser server it frames),
                    targetOrigin, frameUrl (the frame's src), loopback (whether the target is this machine), reachable (true
                    or false once checked, null before; it is only while a manipulation blueprint with the viser backend runs),
                    checkedAt (when it was last checked), reload (a counter api/reconnect bumps) and hint (how to start one)
                x-when: you need to know which viser server is shown and if it is up
                x-dimos-role: context
        /api/target:
            post:
                description: >-
                    Point at a viser server (the UI's host/port + Connect), saved across restarts: host and port (default
                    8095) of the viser a manipulation blueprint serves, or url, a full http(s) URL (it wins over host/port).
                    Checks it right away and answers the new state (as api/state, with reachable); a bad host, port or url
                    gets 400
                x-when: you want Viser to show a viser server at another host, port or URL
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    host:
                                        type: string
                                        description: viser host, e.g. localhost (default), or host:port, or an http(s) URL
                                    port:
                                        type: string
                                        description: viser port (default 8095)
                                    url:
                                        type: string
                                        description: a full http(s) URL instead of host/port
        /api/reconnect:
            post:
                description: >-
                    Check the viser server again now and reload its frame in the open pages. Takes nothing; answers the state
                    (as api/state)
                x-when: the viser view is blank or stale, e.g. after its blueprint restarted
