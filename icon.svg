<svg xmlns="http://www.w3.org/2000/svg" viewBox="5.5 5.5 53 53" width="64" height="64" role="img" aria-label="Viser">
  <!-- dimOS app icon set v6: neon gradient glyph with a soft bloom, the logo's scan lines and a white-hot core; an eye whose iris is a wireframe cube (a viewer for 3D scenes) -->
  <defs>
    <filter id="viser-bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <linearGradient id="viser-a" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="0" y2="50"><stop offset="0" stop-color="#b6fff0"/><stop offset="1" stop-color="#10d6b0"/></linearGradient>
    <g id="viser-glyph">
      <path d="M9 32Q32 9 55 32Q32 55 9 32Z" fill="none" stroke="url(#viser-a)" stroke-width="2.8" stroke-linejoin="round"/>
      <path d="M32 23L39.794 27.5V36.5L32 41L24.206 36.5V27.5Z" fill="none" stroke="url(#viser-a)" stroke-width="2.4" stroke-linejoin="round"/><path d="M24.206 27.5L32 32L39.794 27.5M32 32V41" fill="none" stroke="url(#viser-a)" stroke-width="1.7" stroke-linejoin="round"/>
    </g>
    <linearGradient id="viser-scanrow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#e2e2e2"/><stop offset=".5" stop-color="#c2c2c2"/><stop offset=".75" stop-color="#e2e2e2"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <pattern id="viser-scan" width="64" height="3.6" patternUnits="userSpaceOnUse"><rect width="64" height="3.6" fill="url(#viser-scanrow)"/></pattern>
    <mask id="viser-scanlines" maskUnits="userSpaceOnUse" x="-16" y="-16" width="96" height="96"><rect x="-16" y="-16" width="96" height="96" fill="url(#viser-scan)"/></mask>
    <filter id="viser-core" x="-20%" y="-20%" width="140%" height="140%"><feMorphology in="SourceAlpha" operator="erode" radius="0.9" result="e"/><feGaussianBlur in="e" stdDeviation="0.45" result="eb"/><feFlood flood-color="#fffaf0" flood-opacity=".78"/><feComposite in2="eb" operator="in" result="c"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="c"/></feMerge></filter>
  </defs>
  <g transform="translate(32 32) scale(1.12) translate(-32 -32)">
    <use href="#viser-glyph" filter="url(#viser-bloom)"/>
    <g mask="url(#viser-scanlines)"><use href="#viser-glyph" filter="url(#viser-core)"/></g>
  </g>
</svg>
